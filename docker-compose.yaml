services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SRS@981234#*
      POSTGRES_DB: eps_alerts
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eps_alerts"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3002"
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:SRS%40981234%23*@db:5432/eps_alerts
      VIDEO_API_KEY: ${VIDEO_API_KEY}
      VIDEO_API_SECRET: ${VIDEO_API_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "3002:3002"

volumes:
  pgdata:
